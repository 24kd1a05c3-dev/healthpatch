name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install --require-hashes -r backend/requirements.lock
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest backend/tests -q
        env:
          PYTHONPATH: backend
      - run: python -m compileall -q backend/app
      - run: pip install pip-audit && pip-audit -r backend/requirements.lock --require-hashes --progress-spinner off
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t healthpatch-api .
      - run: docker build -f deploy/Dockerfile.web -t healthpatch-web .
      - run: docker run --rm -e HEALTHPATCH_DOMAIN=health.example.test healthpatch-web caddy validate --config /etc/caddy/Caddyfile
